x-app-environment: &app-environment
  DB_CONNECTION: ${DB_CONNECTION}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}

x-app: &app
  image: ${APP_IMAGE:-ziarah-amg-app:local}
  env_file:
    - .env
  environment: *app-environment
  volumes:
    - ./.env:/var/www/html/.env
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    build:
      context: .
      target: app

  web:
    image: ${WEB_IMAGE:-ziarah-amg-web:local}
    build:
      context: .
      target: web
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ziarah_amg}
      POSTGRES_USER: ${POSTGRES_USER:-ziarah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-testing-database.sql:/docker-entrypoint-initdb.d/init-testing-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  queue:
    <<: *app
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90

  scheduler:
    <<: *app
    command: php artisan schedule:work

  test:
    <<: *app
    profiles:
      - test
    environment:
      <<: *app-environment
      DB_DATABASE: ziarah_amg_testing
    command: composer test
    restart: "no"

volumes:
  postgres-data:
